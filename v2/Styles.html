<style>
  :root{
    --bg:#0b1220; --card:#111a2e; --card2:#0f1930; --muted:#98a2b3; --text:#e6e9f0;
    --border:rgba(255,255,255,0.10); --border2:rgba(255,255,255,0.16);
    --accent:#5fa8ff; --accentSoft:rgba(95,168,255,0.18);
    --good:#50dc82; --warn:#ffcf5a; --bad:#ff6a6a;
    --bottomBarH:64px; --headerH:auto;
    --rowH:56px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-text-size-adjust:100%;
  }
  body.locked{ overflow:hidden; }
  body.locked > :not(#launchOverlay):not(script){ visibility:hidden; }
  .muted{ color:var(--muted); }

  /* ---- Header ---- */
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(to bottom, rgba(11,18,32,0.98), rgba(11,18,32,0.92));
    border-bottom:1px solid var(--border);
    padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .headerBar{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .companyName{ font-size:12px; font-weight:800; letter-spacing:0.4px; color:var(--muted); }
  .portalName{ font-size:15px; font-weight:900; letter-spacing:0.3px; }
  .headerRow{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:8px; }
  .pageTabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .pageTabBtn{
    padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:rgba(255,255,255,0.05); color:var(--text); font-weight:800;
    text-transform:uppercase; letter-spacing:0.3px; font-size:12px; cursor:pointer;
    touch-action:manipulation;
  }
  .pageTabBtn.active{ border-color:var(--accent); background:var(--accentSoft); }
  .metaFields{ display:flex; gap:10px; flex-wrap:wrap; }
  .metaField{ display:flex; flex-direction:column; font-size:10px; color:var(--muted); font-weight:700; gap:3px; }
  .metaField input{
    background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:8px 10px; font-size:16px; width:130px;
  }
  .metaField input#metaInitials{ width:80px; text-transform:uppercase; }

  .pill{
    padding:5px 12px; border-radius:999px; font-size:12px; font-weight:800;
    border:1px solid var(--border); background:rgba(255,255,255,0.05); white-space:nowrap;
  }
  .pill.ok{ color:var(--good); border-color:rgba(80,220,130,0.4); }
  .pill.pending{ color:var(--warn); border-color:rgba(255,207,90,0.4); }
  .pill.err{ color:var(--bad); border-color:rgba(255,106,106,0.4); }

  .banner{ margin:10px 0 0; padding:10px 12px; border-radius:12px; font-size:13px; }
  .banner.warn{ background:#2a1f06; border:1px solid #8a6a18; }
  .banner.err{ background:#2a0b0b; border:1px solid #8a2a2a; }

  /* ---- Pages ---- */
  .page{ display:none; }
  .page.active{ display:block; }
  .wrap{ padding:12px; padding-bottom:calc(var(--bottomBarH) + 20px); max-width:1100px; margin:0 auto; }
  .pageHeading{ font-size:18px; margin:6px 0 10px; }
  .status{ color:var(--muted); font-size:12px; margin-top:14px; }

  /* ---- Sections / groups ---- */
  .group{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; margin:14px 0 6px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; cursor:pointer; touch-action:manipulation;
  }
  .group .gName{ font-weight:900; letter-spacing:0.3px; }
  .group .gCount{ font-size:12px; color:var(--muted); }
  .group .chev{ transition:transform .15s ease; }
  .group.collapsed .chev{ transform:rotate(-90deg); }
  .groupLabels{
    display:grid; gap:8px;
    grid-template-columns:repeat(var(--locCount,3),minmax(40px,0.72fr)) minmax(38px,0.5fr) minmax(44px,0.6fr);
  }
  .colLabel{ font-size:10px; color:var(--muted); font-weight:800; text-align:center; letter-spacing:0.3px; }
  .colLabel.calc{ color:var(--accent); }
  .sectionBody.collapsed{ display:none; }

  /* ---- Item row ---- */
  .itemRow{
    display:grid;
    grid-template-columns:minmax(0,3fr) repeat(var(--locCount,3), minmax(40px,0.72fr)) minmax(38px,0.5fr) minmax(44px,0.6fr);
    gap:8px; align-items:center; background:var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:8px 10px; margin-bottom:6px; position:relative;
  }
  /* Read-only computed cells (BATCH / TOTAL). */
  .cell.calc{ align-items:center; justify-content:center; }
  .calcVal{ width:100%; text-align:center; font-size:14px; font-weight:800; padding:10px 2px; box-sizing:border-box; }
  .calcVal.batchVal{ color:var(--warn); }
  .calcVal.totalVal{ color:var(--text); }
  .itemRow.zebra{ background:#16253f; }
  .itemRow.archived{ opacity:0.5; }
  .itemName{
    font-weight:800; font-size:14px; text-align:right; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0; cursor:pointer;
  }
  .invToolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .invHint{ font-size:12px; }
  .batchChip{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px;
    font-size:10px; font-weight:800; color:#1a1300; background:var(--warn); vertical-align:middle;
  }
  .cell{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .cell input{
    width:100%; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:rgba(255,255,255,0.05); color:var(--text); font-size:16px; text-align:center;
    box-sizing:border-box;
  }
  .cell input:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  .cell input:disabled{ opacity:0.45; }
  .cell input.batchHint{ border-color:rgba(255,207,90,0.5); }

  /* ---- Bottom bar ---- */
  .bottomBar{
    position:fixed; left:0; right:0; bottom:0; z-index:25; height:var(--bottomBarH);
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(11,18,32,0.97); border-top:1px solid var(--border);
  }
  .adjustControls{ display:flex; gap:6px; }
  .searchInput{
    flex:1 1 auto; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:rgba(255,255,255,0.06); color:var(--text); font-size:16px;
  }

  /* ---- Buttons ---- */
  .btn{
    padding:9px 14px; border-radius:10px; border:1px solid var(--border2);
    background:rgba(255,255,255,0.06); color:var(--text); font-weight:800; font-size:13px;
    cursor:pointer; touch-action:manipulation;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accentSoft); border-color:var(--accent); }
  .btn.adjustBtn{ width:46px; font-size:20px; line-height:1; padding:0; height:44px; }
  .btn:disabled{ opacity:0.4; cursor:default; }

  /* ---- Recipes ---- */
  .recipeList{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .recipeCard{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .recipeCard .rName{ font-weight:900; }
  .recipeCard .rMeta{ font-size:12px; color:var(--muted); margin-top:4px; }

  /* ---- Overlay / modal ---- */
  .overlay{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(5,10,20,0.7); padding:18px;
  }
  .overlay.show{ display:flex; }
  .launchOverlay{ display:flex; background:var(--bg); z-index:1000; }
  .modal{ background:var(--card); border:1px solid var(--border2); border-radius:16px; padding:20px; width:min(360px,92vw); }
  .modal h2{ margin:0 0 6px; font-size:18px; }
  .pinInput{
    width:100%; margin:14px 0 6px; padding:12px; font-size:24px; text-align:center;
    letter-spacing:8px; border-radius:12px; border:1px solid var(--border2);
    background:rgba(255,255,255,0.06); color:var(--text);
  }
  .errorText{ color:var(--bad); font-size:13px; min-height:18px; margin-bottom:8px; }
  .launchModal .btn{ width:100%; }

  .recipeCard{ position:relative; }
  .recipeCard .rEdit{ margin-top:10px; width:100%; }

  /* ---- Order guide ---- */
  .ordersHead{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ordersHead .pageHeading{ margin:6px 0; }
  .toggleRow{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .ordersBody{ display:grid; gap:14px; }
  .orderGroup{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
  .orderVendor{ font-weight:900; letter-spacing:0.3px; margin-bottom:8px; }
  .orderTable{ width:100%; border-collapse:collapse; font-size:13px; }
  .orderTable th, .orderTable td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  .orderTable th.num, .orderTable td.num{ text-align:right; white-space:nowrap; }
  .orderTable td.order{ font-weight:900; color:var(--good); }
  .copyOrder{ margin-top:10px; }
  .orderMeta{ font-size:12px; line-height:1.5; margin:2px 0 8px; }
  .orderMin{ font-size:12px; font-weight:800; margin:2px 0 8px; padding:4px 8px; border-radius:8px; display:inline-block; }
  .orderMin.ok{ color:var(--good); background:rgba(60,200,120,0.12); }
  .orderMin.under{ color:#1a1300; background:var(--warn); }
  .tiny{ font-size:10px; line-height:1.2; }

  /* ---- Recipe editor modal ---- */
  .recipeModal{ width:min(560px,94vw); max-height:88vh; overflow:auto; }
  .field{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:700; margin-top:10px; }
  .field input, .field select{
    background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:10px; font-size:16px;
  }
  .fieldRow{ display:flex; gap:10px; }
  .fieldRow .field{ flex:1 1 0; min-width:0; }
  .ingHead{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
  .ingList{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .ingRow{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 70px 88px 40px; gap:6px; align-items:center; }
  .ingRow select, .ingRow input{
    background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:8px; font-size:14px; min-width:0;
  }
  .ingRow .ingName[hidden]{ display:none; }
  .ingRow .ingDel{ padding:8px; font-weight:900; }
  .modalActions{ display:flex; align-items:center; gap:8px; margin-top:18px; }
  .modalActions .spacer{ flex:1 1 auto; }
  .btn.danger{ color:var(--bad); border-color:rgba(255,106,106,0.4); }

  @media (max-width:560px){
    .ingRow{ grid-template-columns:1fr 1fr; }
    .fieldRow{ flex-direction:column; }
  }

  /* ---- Move (drag-reorder) mode ---- */
  body.moveMode .itemRow{ cursor:grab; touch-action:none; }
  body.moveMode .group.section{ cursor:grab; touch-action:none; }
  body.moveMode .cell input{ pointer-events:none; }
  body.moveMode .itemName{ cursor:grab; }
  .moveSource{ opacity:0.55; }
  .dropMark.dropBefore{ box-shadow: inset 0 3px 0 0 var(--accent); }
  .dropMark.dropAfter{ box-shadow: inset 0 -3px 0 0 var(--accent); }
  #moveToggle.primary{ background:var(--accentSoft); border-color:var(--accent); }

  /* ---- Settings ---- */
  .settingsBody{ display:grid; gap:14px; }
  .settingsCard{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .settingsCard h3{ margin:0 0 8px; font-size:15px; }
  .settingsCard .btn{ margin-top:10px; }
  .listGroup{ border-top:1px solid var(--border); padding:8px 0; }
  .listGroup summary{ cursor:pointer; font-weight:800; padding:4px 0; }
  .listRows{ display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .listRow{ display:flex; gap:6px; align-items:center; }
  .listRow input{
    flex:1 1 auto; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:14px;
  }

  /* ---- Entity managers (items / distributors / categories / locations / …) ---- */
  .mgrHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .mgrHead h3{ margin:0; }
  .mgrHead .btn{ margin-top:0; }
  .small{ font-size:12px; }
  .mgrFilters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .mgrFilters .mgrSearch, .mgrFilters select{
    background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:8px; font-size:14px;
  }
  .mgrFilters .mgrSearch{ flex:1 1 160px; min-width:0; }
  .mgrList{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .mgrRow{
    display:flex; align-items:center; gap:8px; padding:8px;
    border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.03);
  }
  .mgrMain{ flex:1 1 auto; min-width:0; }
  .mgrMain strong{ display:inline; }
  .mgrName{
    flex:1 1 auto; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:14px;
  }
  .mgrMeta{ white-space:nowrap; }
  .mgrOrder{ display:flex; flex-direction:column; gap:2px; }
  .mgrActive{ display:flex; align-items:center; }
  .mgrAddRow{ display:flex; gap:6px; align-items:center; margin-top:10px; }
  .mgrAddRow .mgrNew{
    flex:1 1 auto; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:14px;
  }
  .mgrRow .btn{ margin-top:0; }
  .btn.tiny{ padding:2px 8px; font-size:11px; line-height:1.2; min-width:0; }
  .chip{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.04em;
    padding:1px 7px; border-radius:999px; background:var(--accentSoft); color:var(--text);
    border:1px solid var(--border); vertical-align:middle;
  }
  .chip.off{ background:transparent; color:var(--muted); }
  .toggleField{ flex-direction:row !important; align-items:center; gap:8px; }
  .fieldLabel{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .repList{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .repRow{ display:grid; grid-template-columns:1fr 0.8fr 1fr 1.2fr auto; gap:6px; align-items:center; }
  .repRow input{
    background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:8px; font-size:14px; min-width:0;
  }
  @media (max-width:560px){
    .repRow{ grid-template-columns:1fr 1fr; }
    .repRow .repDel{ grid-column:1 / -1; }
  }
  .dayChips{ display:flex; flex-wrap:wrap; gap:6px; }
  .dayChip{
    display:inline-flex; align-items:center; gap:4px; font-size:13px;
    padding:5px 9px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
  }

  /* ---- Responsive: keep rows single-line on tablets (Galaxy Tab A9+ etc.) ---- */
  @media (min-width:600px) and (max-width:1366px){
    .itemRow .itemName{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  }
  @media (hover:none) and (pointer:coarse){
    .cell input, .searchInput, .metaField input{ font-size:16px; } /* prevent iOS zoom */
    .btn.adjustBtn{ width:52px; height:48px; }
  }
</style>
